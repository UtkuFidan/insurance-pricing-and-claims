name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q   # offline: synthetic fixtures + triangles bundled with chainladder
      - name: Offline smoke run of the CLI
        run: ins-ml all --synthetic --n 20000 --folds 3 --trials 2 --rounds 100 --out /tmp/ins-results --figs /tmp/ins-figs
